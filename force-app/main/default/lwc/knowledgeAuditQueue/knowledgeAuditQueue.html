<template>
    <lightning-card title="Duplicate Candidates Queue" icon-name="standard:task2">
        <template lwc:if={showRefresh}>
            <div slot="actions">
                <lightning-button-icon
                    icon-name="utility:refresh"
                    alternative-text="Refresh"
                    onclick={handleRefresh}
                ></lightning-button-icon>
            </div>
        </template>

        <template lwc:if={isLoading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading candidates"></lightning-spinner>
            </div>
        </template>

 <!--: two independent status toggles. Default off → the queue shows
             the actionable Pending set only. "Show resolved" reveals resolved +
             auto-superseded pairs (with a per-row "View Golden Record" action);
             "Show discarded" reveals soft/permanent "not a duplicate" pairs. The
             toggles render whenever the queue isn't in an error/loading state,
             so an empty Pending list can still be widened to inspect history. -->
        <template lwc:if={showStatusToggles}>
            <div class="slds-p-horizontal_medium slds-p-top_small slds-grid slds-gutters_small slds-wrap">
                <lightning-input
                    type="toggle"
                    label="Show resolved"
                    message-toggle-active="On"
                    message-toggle-inactive="Off"
                    checked={showResolved}
                    onchange={handleToggleResolved}
                    class="slds-col"
                ></lightning-input>
                <lightning-input
                    type="toggle"
                    label="Show discarded"
                    message-toggle-active="On"
                    message-toggle-inactive="Off"
                    checked={showDiscarded}
                    onchange={handleToggleDiscarded}
                    class="slds-col"
                ></lightning-input>
            </div>
        </template>

        <template lwc:if={hasCandidates}>
 <!--: lightning-datatable gives resizable columns + native
                 wrap/clip on the long Reasoning text. The custom 'articleCell'
                 type preserves the truncating link + hover popover; the standard
                 'action' type drives the row menu via onrowaction. the
                 action column's rowActions are computed per-row from Status__c. -->
            <c-knowledge-audit-datatable
                key-field="Id"
                data={candidateRows}
                columns={columns}
                hide-checkbox-column
                onrowaction={handleRowAction}
                class="candidate-datatable"
            ></c-knowledge-audit-datatable>
        </template>

        <template lwc:if={isEmpty}>
            <div class="slds-p-around_medium slds-text-align_center">
                <lightning-icon icon-name="utility:check" variant="success" size="large"></lightning-icon>
                <p class="slds-m-top_small slds-text-heading_small">{emptyHeading}</p>
                <p class="slds-text-body_regular">{emptyBody}</p>
            </div>
        </template>

        <template lwc:if={hasError}>
            <div class="slds-p-around_medium">
                <p class="slds-text-color_error">{errorMessage}</p>
            </div>
        </template>
    </lightning-card>
</template>
