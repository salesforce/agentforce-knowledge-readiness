<template>
    <lightning-modal-header label={headerLabel}></lightning-modal-header>
    <lightning-modal-body>
        <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">
            Select which recommendations to act on. The AI will rewrite the article addressing all selected issues in one pass.
        </p>

        <template lwc:if={isProcessing}>
            <div class="slds-text-align_center slds-var-p-vertical_large">
                <lightning-spinner alternative-text="Processing..." size="medium"></lightning-spinner>
                <p class="slds-var-m-top_medium slds-text-color_weak">
                    The AI is rewriting the article to fix the selected issues…
                </p>
            </div>
        </template>

        <template lwc:else>
            <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">
                {rows.length} recommendation(s) · {checkedCount} selected
            </p>

            <template lwc:if={hasPendingDraft}>
                <div class="slds-notify slds-notify_alert slds-theme_warning slds-var-m-bottom_medium" role="alert">
                    <lightning-icon icon-name="utility:warning" size="x-small"
                        class="slds-var-m-right_x-small" alternative-text="Warning">
                    </lightning-icon>
                    <strong>A draft already exists for this article.</strong>
                    Choose which version to apply fixes to:
                    <lightning-radio-group
                        name="fixSource"
                        label="Source version"
                        hide-label
                        options={fixSourceOptions}
                        value={fixSource}
                        type="radio"
                        class="slds-var-m-top_x-small"
                        onchange={handleFixSourceChange}>
                    </lightning-radio-group>
                </div>
            </template>

            <template for:each={rows} for:item="row">
                <div key={row.recId}
                    class="slds-grid slds-grid_vertical-align-start slds-border_bottom slds-var-p-vertical_small kb-rec-row">
                    <div class="kb-rec-check slds-var-m-right_small">
                        <lightning-input
                            type="checkbox"
                            label={row.dimension}
                            variant="label-hidden"
                            checked={row.checked}
                            data-rec-id={row.recId}
                            onchange={handleCheckChange}
                            class="kb-checkbox-tight">
                        </lightning-input>
                    </div>
                    <div class="kb-rec-content">
                        <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-var-m-bottom_xx-small">
                            <lightning-badge label={row.dimension} class="slds-var-m-right_xx-small kb-badge-nowrap"></lightning-badge>
                        </div>
                        <p class="slds-text-body_small">{row.recommendation}</p>
                    </div>
                </div>
            </template>

            <template lwc:if={error}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-var-m-top_medium" role="alert">
                    {error}
                </div>
            </template>
        </template>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button
            label="Cancel"
            onclick={handleClose}
            disabled={isProcessing}
            class="slds-var-m-right_x-small">
        </lightning-button>
        <lightning-button
            label="Dismiss Selected"
            variant={dismissVariant}
            onclick={handleDismissSelected}
            disabled={isProcessing}
            class="slds-var-m-right_x-small">
        </lightning-button>
        <lightning-button
            label="Fix with AI"
            variant={fixVariant}
            icon-name="utility:einstein"
            onclick={handleFixWithAI}
            disabled={isProcessing}>
        </lightning-button>
    </lightning-modal-footer>
</template>
