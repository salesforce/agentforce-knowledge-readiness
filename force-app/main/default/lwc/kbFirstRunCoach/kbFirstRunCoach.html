<template>
    <template lwc:if={shouldShow}>
        <div class="coach-banner slds-box slds-theme_shade slds-m-bottom_medium slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
            <div class="slds-grid slds-grid_vertical-align-center coach-banner__content">
                <lightning-icon icon-name="utility:knowledge_base" size="small" class="slds-m-right_small coach-banner__icon" aria-hidden="true"></lightning-icon>
                <div>
                    <div class="slds-text-heading_small">{titleLabel}</div>
                    <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">{bodyLabel}</div>
                </div>
            </div>
            <div class="coach-banner__actions slds-grid slds-grid_vertical-align-center">
                <lightning-button
                    variant="brand"
                    label={ctaLabel}
                    icon-name="utility:play"
                    onclick={handlePrimary}
                    class="slds-m-right_x-small">
                </lightning-button>
                <lightning-button-icon
                    icon-name="utility:close"
                    variant="bare"
                    alternative-text="Dismiss"
                    title="Dismiss"
                    onclick={handleDismiss}>
                </lightning-button-icon>
            </div>
        </div>
    </template>
</template>
