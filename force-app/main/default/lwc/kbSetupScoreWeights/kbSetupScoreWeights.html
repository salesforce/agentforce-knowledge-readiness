<template>
    <div class="slds-card slds-p-around_medium">
        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Scoring Weights</h3>
        <p class="slds-text-body_small slds-m-bottom_medium slds-text-color_weak">
            Adjust how much each dimension contributes to the overall Readiness Score. Weights must total 100%.
        </p>

        <div class="slds-box slds-theme_info slds-p-around_x-small slds-m-bottom_medium">
            <lightning-icon icon-name="utility:info" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
            <span class="slds-text-body_small">
                <strong>Duplication</strong> and <strong>Conflict</strong> scores only appear after the deduplication pipeline has run (Step 6).
                Set these to <strong>0%</strong> if you are not using the pipeline.
            </span>
        </div>

        <div class="slds-grid slds-wrap slds-gutters_small">
            <template for:each={dimensionList} for:item="dim">
                <div key={dim.key} class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-input
                        type="number"
                        label={dim.label}
                        value={dim.percentage}
                        data-field={dim.key}
                        onchange={handleWeightChange}
                        min="0"
                        max="100"
                        step="1"
                        formatter="percent-fixed"
                        field-level-help={dim.description}>
                    </lightning-input>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">{dim.description}</p>
                </div>
            </template>
        </div>

        <div class="slds-m-top_medium slds-p-around_small slds-box">
            <span class={totalClass}>
                <lightning-icon
                    if:true={isValidTotal}
                    icon-name="utility:success"
                    size="x-small"
                    variant="success"
                    class="slds-m-right_x-small"
                    aria-hidden="true">
                </lightning-icon>
                <lightning-icon
                    if:false={isValidTotal}
                    icon-name="utility:error"
                    size="x-small"
                    variant="error"
                    class="slds-m-right_x-small"
                    aria-hidden="true">
                </lightning-icon>
                {totalLabel}
            </span>
            <template if:false={isValidTotal}>
                <p class="slds-text-color_error slds-text-body_small slds-m-top_xx-small">
                    Weights must sum to exactly 100% before saving.
                </p>
            </template>
        </div>

        <div class="slds-m-top_medium">
            <lightning-button
                label="Reset to Defaults"
                variant="neutral"
                onclick={handleResetDefaults}>
            </lightning-button>
        </div>
    </div>
</template>
